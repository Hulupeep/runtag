# J-DEMO-TAP — NFC tag tap-in / tap-out behaviour (US-3, US-5)
journey_meta:
  id: J-DEMO-TAP
  from_spec: "docs/prd.md"
  covers_reqs: [US-3, US-5, INV-D2, INV-D5, INV-D7]
  type: "e2e"
  dod_criticality: critical
  status: passing
  last_verified: "2026-09-27"
  owner: "@hulupeep"

preconditions:
  - description: "User has started the demo and is on Scene 2"
    setup_hint: "Click [data-testid='start-demo-button'] before steps"

timing:
  tap_feedback: 100   # visual feedback must start within 100ms (INV-D5)
  nfc_ripple: 600     # green #34c759 ripple, ease-out
  scene_transition: 500

steps:
  - step: 1
    name: "Click NFC tag -> ripple + scene 3 (INV-D5)"
    required_elements:
      - selector: "[data-testid='nfc-tag']"
  - step: 2
    name: "Enter and Space on focused tag trigger the tap (INV-D7)"
    required_elements:
      - selector: "[data-testid='nfc-tag']:focus-visible"
  - step: 3
    name: "Scene 5 cannot advance without tapping the tag (INV-D2)"
    required_elements:
      - selector: "[data-testid='scene-5']"
  - step: 4
    name: "Rapid double-tap registers once; no scene is skipped (INV-D1)"
    required_elements:
      - selector: "[data-testid='nfc-tag']"

test_hooks:
  e2e_test_file: "tests/e2e/interactions.spec.ts"
