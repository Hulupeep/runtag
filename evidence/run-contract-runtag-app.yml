run_contract:
  loop: spec-build            # then feature-build per ready ticket
  goal: RunTag works as a phone web app with real NFC tags (tap in, tap out, chain) on runtag.vercel.app
  input_artifact: docs/prd.md + docs/specs/runtag-stories/ + owner decisions 2026-10-10
  path: QA/loops/spec-build.yaml -> QA/loops/feature-build.yaml (duo-build reviews)
  current_stage_or_rail: discover
  next_gate: grounding written; problem + real-data-it-must-satisfy stated
  durable_evidence:
    grounding: PRDs/runtag-app-grounding.md
    prd: PRDs/runtag-app-prd.md
    verdict: PRDs/runtag-app-verdict.md
    falsification: PRDs/runtag-app-falsification.md
    hops: PRDs/runtag-app-hops.md
  simulation_required: true until specflow-simulate/B.5 runs on the selected slice
  owner_authority_2026-10-10:
    storage: on-device only (no backend, no login)
    issues_after_SHIP: pre-approved
    push_pr_merge_deploy: pre-approved (merge to main == Vercel production deploy)
    on_unfixable_failure: skip ticket, record, continue independent tickets
  stop_condition: owner can run with physical tags from their phone on runtag.vercel.app; all selected tickets' journeys pass
  never_without_human:
    - create issues from a DO_NOT_SHIP PRD
    - fabricate a green verdict
    - new paid services or deleting user data
  owner_decisions_2026-10-11:
    app_shell_review_limit: >
      #16 build-ready scoped review allowance exhausted (initial + one regrade; 25/27 verified, F-7 fixed after).
      Owner chose: superseding APP-SHELL ticket carrying the v3 spec + F-7 amendment, linked to #16's history;
      #16 closed as superseded. Not a silent rename: escalation outcome decided by the owner.
    rigor: full Specflow rigor for every remaining ticket (build-ready prep review + implementation review + CI)
  owner_decision_2026-10-12:
    app_shell_24_escalated: >
      #24 regrade escalated (F-SEAM-GRAPH: moving file paths out of seam declarations dropped shared
      store/origin relationships from the epic graph). Owner chose: supersede once more; seams modelled
      as route literals, data-testids and exported API identifiers; full epic graph regenerated.
  owner_decision_2026-10-13:
    slice_size_amendment: >
      Owner decision (AskUserQuestion answer, 2026-10-13): the feature-build "slice < 1000 hand-written lines"
      limit counts shipped production code only; tests and contracts are excluded (they add safety, not scope).
      Applies to APP-SHELL #26 and all RunTag app tickets. APP-SHELL #26: 659 production lines (<1000);
      tests 508 and contracts 130 excluded per this amendment.
